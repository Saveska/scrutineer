# Scrutineer requirements.
# Each entry says what must hold, which signals it uses, where the rule comes from,
# and which function in src/scrutineer/checks.py checks it.
# source_type is one of: regulation, dataset_documentation, observed_from_data, illustrative, ai_drafted

- id: REQ-001
  text: No door may be open while the bus moves faster than 5 km/h.
  signals: [status_doorIsOpen, odometry_vehicleSpeed]
  parameters:
    limit_kmh: 5.0
  source_type: regulation
  source: >
    UN Regulation R107 (EUR-Lex 2015 version), Annex 3 para 7.6.5.1.9:
    the doors shall be prevented from opening if the vehicle moves at a higher speed than 5 km/h.
    
  check: check_door_speed

- id: REQ-002
  text: The halt brake must be active once the bus has been standing still for more than 3 seconds.
  signals: [status_haltBrakeIsActive, odometry_vehicleSpeed]
  parameters:
    grace_s: 3 
  source_type: [dataset_documentation, observed_from_data]
  source: >
    ZTBus dataset paper, Table 1, description of status_haltBrakeIsActive,
    which says the halt brake is activated automatically whenever the bus stands still.
    Grace period: observed in the 9 sample journeys where the signal was active,
    99.85% of stops where the brake came on did so within 3 seconds.
  notes: >
    Standing still means odometry_vehicleSpeed <= 0. If the brake flag is never
    active in a journey (seen in 1 of 10 sample journeys), the result is INCONCLUSIVE, not FAIL.
  check: check_halt_brake

- id: REQ-003
  text: >
    The electric drive must not apply traction force above 100 N while a door is open,
    except in the last 2 seconds before the door closes.
  signals: [status_doorIsOpen, traction_tractionForce]
  parameters:
    limit_n: 100
    close_grace_s: 2
  source_type: [derived_from_regulation, observed_from_data]
  source: >
    UN R107 (EUR-Lex 2015 version), para 2.27 and Annex 3 para 7.6.5.9: driving away from rest with a door
    not fully closed must be prevented, or the driver warned. This checks prevention.
    Parameters from the 10 sample journeys: with a door open, force was 0 N or less in
    at least 99% of rows. All values above 100 N fell in the last 2 s before closing.
  notes: Pushing only in the last 2 s before closing would not be caught.
  check: check_door_traction

- id: REQ-004
  text: Electric power demand must stay between -340 kW and +370 kW.
  signals: [electric_powerDemand]
  parameters:
    min_kw: -340
    max_kw: 370
  source_type: [dataset_documentation, observed_from_data]
  source: >
    ZTBus dataset paper, Technical Validation, "Statistical analysis": combined motor
    capacity of about 320 kW in both directions, plus 20 to 30 kW auxiliary consumption,
    which gives a documented range of about -320 to +350 kW.
    Margin: these are approximate figures. With the strict range, 7 of 10 sample journeys
    exceeded +350 kW by up to 11.7 kW during normal acceleration, so a 20 kW margin was
    added on each side. The margin was chosen after seeing the data.
  notes: >
    This rule catches implausible values (spikes, unit or sign errors), not small
    overshoots of the approximate documented peak.
  check: check_power_range

- id: REQ-005
  text: Vehicle control unit signals must have no gap of 10 seconds or more.
  signals: [electric_powerDemand, odometry_vehicleSpeed, odometry_steeringAngle,
            odometry_articulationAngle, odometry_wheelSpeed_fl, odometry_wheelSpeed_fr,
            odometry_wheelSpeed_ml, odometry_wheelSpeed_mr, odometry_wheelSpeed_rl,
            odometry_wheelSpeed_rr, status_doorIsOpen, status_gridIsAvailable,
            status_haltBrakeIsActive, status_parkBrakeIsActive,
            traction_brakePressure, traction_tractionForce]
  parameters:
    max_gap_s: 10
  source_type: [dataset_documentation]
  source: >
    ZTBus dataset paper, Technical Validation, selection criteria: missions with a gap of
    at least 10 s in any vehicle control unit data were rejected. GNSS, ITCS (passengers,
    route, stop) and ambient temperature are excluded, since the paper describes them as
    possibly missing in normal operation.
  notes: >
    Only checks for empty values. If whole rows were missing (a jump in the
    timestamps), this rule would not notice, because no timing rule was added.
  check: check_signal_gaps